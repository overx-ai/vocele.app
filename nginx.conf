# Static file server for the Vocele marketing site.
# No SPA fallback (try_files ... /index.html) on purpose: this is a multi-page
# statically-rendered site, so a missing path is a real 404, not a client-router
# route. That's exactly what we want for SEO — every real URL is a real file.
# (The 404 page itself client-redirects humans to the locale home — that logic
# lives in src/pages/404.astro so it survives a move to Vercel/CF Pages/GH Pages.)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Emit relative Location headers on redirects. Default (absolute) would build
    # http://<host>/... — behind TLS-terminating Traefik that downgrades an https
    # request to http and forces a second redirect hop.
    absolute_redirect off;

    # Canonicalize to the no-trailing-slash form (Astro trailingSlash: 'never'):
    # 301 /path/ -> /path so each page has exactly one 200 URL. Root '/' is exempt
    # ((.+) needs a char before the final slash, so '/' can't match). Query string
    # is preserved; absolute_redirect off above keeps the Location relative.
    location ~ ^(.+)/$ {
        return 301 $1$is_args$args;
    }

    # Astro emits pretty-URL directories: /pricing -> /pricing/index.html.
    # Point straight at the built index.html — do NOT probe $uri/ (a bare directory
    # match makes nginx 301 /pricing -> /pricing/, which fights the canonicalization
    # above and loops).
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Custom 404 page (Astro builds /404.html).
    error_page 404 /404.html;

    # SEO / crawler files must be served with correct content types.
    location = /robots.txt   { add_header Content-Type text/plain; }
    location = /llms.txt     { add_header Content-Type text/plain; }
    location = /sitemap.xml  { add_header Content-Type application/xml; }
    location = /site.webmanifest { add_header Content-Type application/manifest+json; }

    # Long-cache immutable hashed assets (Astro fingerprints files in /_astro/).
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache images a while, but not forever (they may be replaced pre-launch).
    location ~* \.(png|jpg|jpeg|webp|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # HTML should always be revalidated so content/SEO changes go live on deploy.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # Baseline security headers (safe for a static marketing site).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 512;
}
